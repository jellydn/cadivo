name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # mlx-swift-lm needs swift-syntax 602+, so Xcode 26 (Swift 6.2) or newer.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Release, as for local runs: FluidAudio and MLX are slow in debug.
      - name: Build
        run: swift build -c release

      # Unit tests only: they cover the pure metrics and coach parsing and need no models or audio.
      - name: Test
        run: ./scripts/test.sh
